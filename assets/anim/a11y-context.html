<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#f4f5f7;overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f4f5f7}
  .frame{position:relative;width:1185px;height:740px;box-sizing:border-box;padding:30px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f4f5f7;border-radius:4px}
  /* Smooth, single-pass zoom-out that reveals the full storyboard, then holds. */
  .frame img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;animation:zoomOut 3.6s cubic-bezier(.16,1,.3,1) both}
  @keyframes zoomOut{from{transform:scale(2.6)}to{transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.frame img{animation:none;transform:scale(1)}}
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <img src="../img/a11y-storyboard.jpg" alt="Accessibility journey — a nine-panel storyboard tracing the flow from a support ticket being seen, through QA and product-team triage, onboarding and accessibility training, leadership support and empathy building, to centralized resources, critique templates, and continuous accessibility testing">
    </div>
  </div>
</body>
</html>
