<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff}
  .stage{position:relative;width:100%;background:#ffffff}
  .stage img{display:block;width:100%;height:auto}
  /* Design 1 sets the height (relative); Design 2 stacks over it and cross-fades in, then holds. */
  #d1{position:relative;z-index:1;animation:f1 9s linear 1 both}
  #d2{position:absolute;top:0;left:0;z-index:2;animation:f2 9s linear 1 both}
  @keyframes f1{0%{opacity:1}62%{opacity:1}74%{opacity:0}100%{opacity:0}}
  @keyframes f2{0%{opacity:0}62%{opacity:0}74%{opacity:1}100%{opacity:1}}
  @media(prefers-reduced-motion:reduce){#d1{animation:none;opacity:0}#d2{animation:none;opacity:1}}
</style>
</head>
<body>
  <div class="stage">
    <img id="d1" src="gopro-fade-1.jpg" alt="GoPro marketing homepage — first design">
    <img id="d2" src="gopro-fade-2.jpg" alt="GoPro marketing homepage — final design">
  </div>
</body>
</html>
